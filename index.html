    <script>
      (function() {
        // 1. Unregister any stale Service Workers that could hold old script bundles
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }

        // 2. Immediate Error Handler for Script & Chunk Loading Failures after Deployments
        function handleChunkError(errStr) {
          var isChunkError = /Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk|404|Unexpected token/i.test(errStr);
          if (isChunkError) {
            var lastReload = sessionStorage.getItem('app_chunk_reload_time');
            var now = Date.now();
            if (!lastReload || (now - parseInt(lastReload, 10)) > 15000) {
              sessionStorage.setItem('app_chunk_reload_time', now.toString());
              window.location.reload(true);
            }
          }
        }

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message) || String(e));
          handleChunkError(msg);
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = e && (e.reason && (e.reason.message || String(e.reason)));
          handleChunkError(msg);
        });
      })();
    </script>
